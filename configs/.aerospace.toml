# AeroSpace configuration
# Managed in SetupEnv. Install it as ~/.aerospace.toml.

config-version = 2

after-startup-command = []
start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 24

# Keep the pointer on the active display without moving it on every window focus.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = true

# A small, predictable set is easier to remember than one workspace per letter.
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

# App defaults: terminal, web, development, communication, and notes.
on-window-detected = [
    { if.app-id = 'com.googlecode.iterm2', run = 'move-node-to-workspace 1' },
    { if.app-id = 'com.google.Chrome', run = 'move-node-to-workspace 2' },
    { if.app-id = 'com.microsoft.VSCode', run = 'move-node-to-workspace 3' },
    { if.app-id = 'com.apple.dt.Xcode', run = 'move-node-to-workspace 3' },
    { if.app-id = 'com.tinyspeck.slackmacgap', run = 'move-node-to-workspace 4' },
    { if.app-id = 'com.hnc.Discord', run = 'move-node-to-workspace 4' },
    { if.app-id = 'com.goodnotesapp.x', run = 'move-node-to-workspace 5' },

    # Utility and authentication windows work better as floating windows.
    { if.app-id = 'com.1password.1password', run = 'layout floating' },
    { if.app-id = 'com.apple.systempreferences', run = 'layout floating' },
]

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 0
    inner.vertical = 0
    outer.left = 0
    outer.bottom = 0
    outer.top = 0
    outer.right = 0

[mode.main.binding]
    # Layout
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'
    alt-f = 'fullscreen'

    # Focus (Vim directions)
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'
    alt-backtick = 'focus-back-and-forth'

    # Move windows
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Resize and rebalance
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'
    alt-b = 'balance-sizes'

    # Workspaces
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    # Swap the focused monitor's workspace with a workspace on another monitor.
    alt-ctrl-1 = '''exec-and-forget /bin/sh -c "$HOME/.config/aerospace/swap-workspace.sh 1"'''
    alt-ctrl-2 = '''exec-and-forget /bin/sh -c "$HOME/.config/aerospace/swap-workspace.sh 2"'''
    alt-ctrl-3 = '''exec-and-forget /bin/sh -c "$HOME/.config/aerospace/swap-workspace.sh 3"'''
    alt-ctrl-4 = '''exec-and-forget /bin/sh -c "$HOME/.config/aerospace/swap-workspace.sh 4"'''
    alt-ctrl-5 = '''exec-and-forget /bin/sh -c "$HOME/.config/aerospace/swap-workspace.sh 5"'''
    alt-ctrl-6 = '''exec-and-forget /bin/sh -c "$HOME/.config/aerospace/swap-workspace.sh 6"'''
    alt-ctrl-7 = '''exec-and-forget /bin/sh -c "$HOME/.config/aerospace/swap-workspace.sh 7"'''
    alt-ctrl-8 = '''exec-and-forget /bin/sh -c "$HOME/.config/aerospace/swap-workspace.sh 8"'''
    alt-ctrl-9 = '''exec-and-forget /bin/sh -c "$HOME/.config/aerospace/swap-workspace.sh 9"'''

    # Move a window and follow it to the destination workspace.
    alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
    alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
    alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
    alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
    alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
    alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
    alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
    alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
    alt-shift-9 = 'move-node-to-workspace --focus-follows-window 9'

    alt-tab = 'workspace-back-and-forth'

    # Multi-monitor controls
    alt-leftSquareBracket = 'focus-monitor --wrap-around prev'
    alt-rightSquareBracket = 'focus-monitor --wrap-around next'
    alt-shift-leftSquareBracket = 'move-workspace-to-monitor --wrap-around prev'
    alt-shift-rightSquareBracket = 'move-workspace-to-monitor --wrap-around next'

    # Swap the visible workspaces between the focused and adjacent monitors.
    alt-ctrl-leftSquareBracket = '''exec-and-forget /bin/sh -c "$HOME/.config/aerospace/swap-workspace.sh prev"'''
    alt-ctrl-rightSquareBracket = '''exec-and-forget /bin/sh -c "$HOME/.config/aerospace/swap-workspace.sh next"'''

    # Less common/destructive operations live in service mode.
    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    b = ['balance-sizes', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    h = ['join-with left', 'mode main']
    j = ['join-with down', 'mode main']
    k = ['join-with up', 'mode main']
    l = ['join-with right', 'mode main']
